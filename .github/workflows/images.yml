# Compile les images Docker de la plateforme et les publie sur GHCR.
# Le serveur Coolify ne compile plus rien : il télécharge les images (docker-compose.coolify.yml).
name: Images Docker

on:
  push:
    branches: [main, feat/admin-plateforme-production]
    paths-ignore:
      - "apps/mobile/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/smartlife1464-commits/eev-financial

jobs:
  build:
    name: Image ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: pocketbase
            dockerfile: docker/Dockerfile.pocketbase
            build_args: ""
          - service: api
            dockerfile: docker/Dockerfile.api
            build_args: ""
          - service: web
            dockerfile: docker/Dockerfile.web
            build_args: |
              NGINX_CONF=docker/nginx.coolify.conf
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Facultatif : redéploie Coolify une fois les images publiées.
  # Secrets du dépôt : COOLIFY_DEPLOY_URL (https://<coolify>/api/v1/deploy?uuid=<application>)
  # et COOLIFY_TOKEN (jeton d'API Coolify avec la permission « deploy »).
  deploy:
    name: Redéployer sur Coolify
    needs: build
    runs-on: ubuntu-latest
    env:
      COOLIFY_DEPLOY_URL: ${{ secrets.COOLIFY_DEPLOY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - name: Déclencher le déploiement
        if: env.COOLIFY_DEPLOY_URL != '' && env.COOLIFY_TOKEN != ''
        run: |
          curl -fsS -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_DEPLOY_URL"
      - name: Aucun webhook configuré
        if: env.COOLIFY_DEPLOY_URL == '' || env.COOLIFY_TOKEN == ''
        run: echo "Secrets COOLIFY_DEPLOY_URL / COOLIFY_TOKEN absents ; déploiement à lancer depuis Coolify."
