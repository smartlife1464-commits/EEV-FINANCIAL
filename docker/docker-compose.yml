services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: eev-pocketbase
    restart: unless-stopped
    volumes:
      - ./pocketbase/pb_data:/pb_data
      - ./pocketbase/pb_migrations:/pb_migrations
      - ./pocketbase/pb_hooks:/pb_hooks
    environment:
      - POCKETBASE_ENCRYPTION_KEY=${POCKETBASE_ENCRYPTION_KEY:-eev-secure-db-key-2026}
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: eev-api
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    environment:
      - PORT=4000
      - NODE_ENV=production
      - POCKETBASE_URL=http://pocketbase:8090
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL:-admin@espritvie.org}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD:-AdminEspritVie2026!}
      - CORS_ORIGIN=*
    ports:
      - "127.0.0.1:4000:4000"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: eev-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

